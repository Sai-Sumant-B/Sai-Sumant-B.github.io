<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sai Sumanth - CISA-certified Cybersecurity GRC, Vendor Risk, Infrastructure Controls, Network Security Validation, SIEM, DLP, PAM, and Audit Readiness professional." />
  <meta name="keywords" content="Sai Sumanth, Cybersecurity GRC, Infrastructure Security, Network Security, Vendor Risk, TPRM, CISA, SOC 2, ISO 27001, HIPAA, Splunk, CyberArk, DLP, Drata, VISO Trust, JIRA" />
  <meta name="author" content="Sai Sumanth" />
  <title>Sai Sumanth | Cybersecurity GRC & Infrastructure Security</title>

  <style>
    :root {
      --bg: #05070d;
      --surface: rgba(255, 255, 255, 0.075);
      --surface-strong: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.16);
      --line-strong: rgba(255, 255, 255, 0.28);
      --text: #f7fbff;
      --muted: rgba(247, 251, 255, 0.68);
      --muted-2: rgba(247, 251, 255, 0.50);
      --cyan: #6fffe9;
      --blue: #7aa7ff;
      --purple: #c8a2ff;
      --green: #9dffb0;
      --radius-xl: 34px;
      --radius-lg: 26px;
      --radius-md: 18px;
      --max: 1160px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --spring: cubic-bezier(.19, 1, .22, 1);
      --silk: cubic-bezier(.25, .46, .45, .94);
      --shadow: 0 28px 90px rgba(0, 0, 0, .38);
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 96px; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
      background: var(--bg);
      overflow-x: hidden;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 12%, rgba(111, 255, 233, .22), transparent 28%),
        radial-gradient(circle at 82% 7%, rgba(122, 167, 255, .22), transparent 30%),
        radial-gradient(circle at 65% 78%, rgba(200, 162, 255, .18), transparent 35%),
        linear-gradient(180deg, #070a12 0%, #05070d 62%, #02030a 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
      transform: translateZ(0);
    }

    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 64px 64px, 64px 64px; }
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    ::selection { color: #031018; background: var(--cyan); }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
      border-radius: 12px;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      width: 44vw;
      height: 44vw;
      min-width: 420px;
      min-height: 420px;
      border-radius: 999px;
      filter: blur(42px);
      opacity: .16;
      transform: translate3d(0,0,0);
      will-change: transform, opacity;
      animation: orbBreath 18s var(--silk) infinite alternate;
    }

    .orb.two { animation-duration: 19s; animation-delay: -3s; }
    .orb.three { animation-duration: 23s; animation-delay: -7s; }

    @keyframes orbBreath {
      from { opacity: .12; }
      to { opacity: .20; }
    }

    .orb.one { left: -20vw; top: 8vh; background: var(--cyan); }
    .orb.two { right: -18vw; top: 36vh; background: var(--blue); }
    .orb.three { left: 32vw; bottom: -28vw; background: var(--purple); }

    .spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: .24;
      background: radial-gradient(520px circle at var(--x, 50%) var(--y, 40%), rgba(255,255,255,.08), transparent 44%);
      transition: opacity 600ms var(--ease);
      will-change: background;
    }

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 10000;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--purple));
      box-shadow: 0 0 24px rgba(111,255,233,.32);
    }

    .container {
      width: min(100% - 44px, var(--max));
      margin: 0 auto;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 999;
      padding: 14px 0;
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      background: rgba(5, 7, 13, .58);
      border-bottom: 1px solid rgba(255,255,255,.10);
      animation: navReveal 760ms var(--spring) both;
      transition: padding 520ms var(--spring), background 520ms var(--ease), border-color 520ms var(--ease);
    }

    body.scrolled .nav {
      padding: 10px 0;
      background: rgba(5, 7, 13, .72);
      border-bottom-color: rgba(255,255,255,.16);
    }

    @keyframes navReveal {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-inner {
      width: min(100% - 34px, var(--max));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 850;
      letter-spacing: -.03em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #061018;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 16px 40px rgba(111,255,233,.18);
      font-weight: 950;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
      list-style: none;
      padding: 6px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
    }

    .nav-links a {
      display: block;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .92rem;
      transition: color 420ms var(--ease), background 420ms var(--ease), transform 520ms var(--spring);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: rgba(255,255,255,.10);
      transform: translateY(-1px);
    }

    .menu-btn {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.07);
      cursor: pointer;
    }

    section {
      padding: 86px 0;
      scroll-margin-top: 96px;
    }

    .hero {
      min-height: calc(100vh - 70px);
      display: grid;
      align-items: center;
      padding: 72px 0 66px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(330px, .78fr);
      gap: 36px;
      align-items: center;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(111,255,233,.26);
      color: var(--cyan);
      background: rgba(111,255,233,.075);
      font-weight: 800;
      font-size: .88rem;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(157,255,176,.6);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(157,255,176,.6); }
      70% { box-shadow: 0 0 0 11px rgba(157,255,176,0); }
      100% { box-shadow: 0 0 0 0 rgba(157,255,176,0); }
    }

    h1 {
      max-width: 880px;
      margin-bottom: 24px;
      font-size: clamp(3rem, 7vw, 6.9rem);
      line-height: .91;
      letter-spacing: -.08em;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(110deg, #fff 0%, #dffefa 36%, #a9c5ff 70%, #ead6ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      background-size: 180% 180%;
      animation: textGlow 9s ease-in-out infinite alternate;
    }

    @keyframes textGlow {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }

    .hero-text {
      max-width: 780px;
      color: var(--muted);
      font-size: clamp(1.08rem, 1.8vw, 1.32rem);
    }

    .hero-text strong { color: var(--text); font-weight: 850; }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 30px 0 26px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      cursor: pointer;
      font-weight: 850;
      transition: transform 620ms var(--spring), box-shadow 620ms var(--spring), background 520ms var(--ease), border-color 520ms var(--ease);
      will-change: transform;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0;
      transform: translateX(-60%) skewX(-16deg);
      background: linear-gradient(110deg, transparent, rgba(255,255,255,.26), transparent);
      transition: opacity 560ms var(--ease), transform 960ms var(--spring);
    }

    .btn:hover::before { opacity: 1; transform: translateX(60%) skewX(-16deg); }
    .btn:hover { transform: translateY(-2px) scale(1.008); }
    .btn:active { transform: translateY(0) scale(.992); }

    .btn-primary {
      color: #031018;
      border: 0;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 20px 44px rgba(111,255,233,.20);
    }

    .btn-primary:hover { box-shadow: 0 28px 70px rgba(122,167,255,.24); }

    .btn-secondary {
      color: var(--text);
      background: rgba(255,255,255,.075);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .btn-secondary:hover {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.11);
    }

    .role-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .pill {
      padding: 9px 12px;
      border-radius: 999px;
      color: rgba(247,251,255,.74);
      background: rgba(255,255,255,.065);
      border: 1px solid rgba(255,255,255,.10);
      font-size: .91rem;
      transition: 280ms var(--ease);
    }

    .pill:hover { color: var(--text); background: rgba(255,255,255,.105); transform: translateY(-1px); }

    .glass {
      transform: translateZ(0);
      backface-visibility: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.105), rgba(255,255,255,.055));
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      overflow: hidden;
    }

    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 560ms var(--ease);
      background: radial-gradient(480px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.18), transparent 42%);
    }

    .glass:hover::before { opacity: 1; }

    .snapshot {
      border-radius: var(--radius-xl);
      padding: 24px;
      transform: translateZ(0);
    }

    .snapshot-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .snapshot h2 {
      font-size: 1.35rem;
      letter-spacing: -.035em;
    }

    .available {
      flex: none;
      padding: 7px 10px;
      border-radius: 999px;
      color: #061018;
      background: var(--green);
      font-weight: 950;
      font-size: .76rem;
    }

    .signal-grid {
      display: grid;
      gap: 10px;
    }

    .signal {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      align-items: center;
      padding: 13px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.10);
    }

    .signal-num {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #041018;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .signal strong { display: block; margin-bottom: 1px; }
    .signal span { color: var(--muted-2); font-size: .9rem; }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(260px, .45fr);
      gap: 26px;
      align-items: end;
      margin-bottom: 30px;
    }

    .label {
      color: var(--cyan);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(2.1rem, 4vw, 3.75rem);
      line-height: 1.02;
      letter-spacing: -.065em;
    }

    .section-copy {
      color: var(--muted);
      font-size: 1.02rem;
    }

    .impact-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    .metric {
      min-height: 156px;
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: transform 720ms var(--spring), border-color 520ms var(--ease), background 520ms var(--ease);
    }

    .metric:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.26); }

    .metric strong {
      display: block;
      margin-bottom: 10px;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: .95;
      letter-spacing: -.065em;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: .92rem;
    }

    .expertise-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
